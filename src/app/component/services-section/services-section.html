<section
  id="services"
  class="px-4 py-16 sm:px-8 lg:px-12 lg:py-20 xl:px-[98px]"
  aria-labelledby="services-title"
>
  <div class="mx-auto flex max-w-[1244px] flex-col gap-12 lg:gap-20">
    <app-section-heading
      headingId="services-title"
      title="Our landscaping work and services"
      highlight="services"
      description="Whether you need a fresh start or steady upkeep, our team has the skills and equipment to bring your outdoor space to life."
    />
    <ul class="grid gap-10 md:grid-cols-2 lg:grid-cols-3">
      @for (service of services; track service.id) {
        <li><app-icon-card [item]="service" /></li>
      }
    </ul>
  </div>
</section>
