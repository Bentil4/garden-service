<section
  id="about"
  class="scroll-mt-4 px-4 py-16 sm:px-8 lg:px-12 lg:py-20 xl:px-[98px]"
  aria-labelledby="about-title"
>
  <div class="mx-auto flex max-w-[1244px] flex-col gap-12 lg:gap-20">
    <app-section-heading
      headingId="about-title"
      title="Caring For Your Private Plants, Our Expertise"
      highlight="Private Plants"
      description="EcoSculpt is a team of local landscapers who treat every garden as a living project. We pair thoughtful design with sustainable practices to create outdoor spaces you will love for years."
    />
    <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-[552fr_596fr] lg:gap-24">
      <ul class="flex flex-col gap-10 md:col-span-2 lg:col-span-1">
        @for (card of cards; track card.id) {
          <li><app-icon-card [item]="card" /></li>
        }
      </ul>
      <div
        class="relative aspect-4/3 overflow-hidden rounded-2xl bg-muted md:col-span-2 lg:col-span-1 lg:aspect-auto"
      >
        <img
          class="object-cover"
          ngSrc="images/about.webp"
          ngSrcset="480w, 720w, 900w, 1200w"
          alt="A gardener tending a flower bed"
          fill
          sizes="(min-width: 1024px) 48vw, 100vw"
        />
      </div>
    </div>
  </div>
</section>
