<section
  id="pricing"
  class="px-4 py-16 sm:px-8 lg:px-12 lg:py-20 xl:px-[98px]"
  aria-labelledby="pricing-title"
>
  <div class="mx-auto flex max-w-[1244px] flex-col gap-12 lg:gap-20">
    <app-section-heading
      headingId="pricing-title"
      title="Pricing Table"
      highlight="Table"
      align="center"
      description="Simple monthly plans for every garden. Pick the level of care that fits your space and your budget."
    />
    <ul class="grid gap-10 md:grid-cols-2 lg:grid-cols-3">
      @for (plan of plans; track plan.id) {
        <li
          [class.md:col-span-2]="$last"
          [class.md:mx-auto]="$last"
          [class.md:w-[calc(50%-1.25rem)]]="$last"
          [class.lg:col-span-1]="$last"
          [class.lg:w-auto]="$last"
        >
          <app-pricing-card class="h-full" [plan]="plan" />
        </li>
      }
    </ul>
  </div>
</section>
