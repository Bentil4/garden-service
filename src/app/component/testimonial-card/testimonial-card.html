<figure class="relative pt-10 sm:pt-0 sm:pl-11">
  <span
    class="absolute top-0 left-6 size-20 overflow-hidden rounded-full bg-card shadow-[2px_6px_28px_0_rgb(108_108_108/0.25)] sm:top-1/2 sm:left-0 sm:-translate-y-1/2"
  >
    <img class="object-cover object-top" [ngSrc]="testimonial().avatarSrc" alt="" fill />
  </span>
  <div
    hlmCard
    class="gap-10 px-6 pt-14 pb-8 sm:pt-8 sm:pr-10 sm:pl-[65px]"
    [class.bg-primary]="testimonial().featured"
    [class.text-primary-foreground]="testimonial().featured"
  >
    <blockquote
      class="leading-6 font-medium"
      [class.text-muted-foreground]="!testimonial().featured"
    >
      <p>“{{ testimonial().quote }}”</p>
    </blockquote>
    <figcaption class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-col">
        <span
          class="font-heading text-[1.375rem]/7 font-semibold sm:text-[1.75rem]/8"
          [class.text-foreground]="!testimonial().featured"
        >
          {{ testimonial().name }}
        </span>
        <span class="text-xs/4" [class.text-muted-foreground]="!testimonial().featured">
          {{ testimonial().role }}
        </span>
      </div>
      <img ngSrc="icons/stars-5.svg" width="112" height="16" alt="Rated 5 out of 5 stars" />
    </figcaption>
  </div>
</figure>
